<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 03</title>
</head>
<body>

    <h2>Ejercicio 03</h2>

    <label>Ingrese una palabra:</label>
    <input type="text" id="palabra">

    <br><br>

    <button onclick="invertir()">Invertir</button>

    <br><br>

    <label>Resultado:</label>
    <input type="text" id="resultado" readonly>

    <script>
        function invertir() {

            let palabra = document.getElementById("palabra").value;

            let inversa = palabra.split("").reverse().join("");

            document.getElementById("resultado").value = inversa;
        }
    </script>

</body>
</html>
